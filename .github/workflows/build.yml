name: build

# Every push and pull request is compiled on a clean Windows machine.
# Pushing a tag like v1.0.0 also publishes a release with the exe built here (not on anyone's PC).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed only to create the release on a tag
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path bin/StayFocusNotes.exe, README.md, LICENSE -DestinationPath StayFocusNotes.zip
          "$((Get-FileHash StayFocusNotes.zip -Algorithm SHA256).Hash.ToLower())  StayFocusNotes.zip" | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: StayFocusNotes
          path: |
            StayFocusNotes.zip
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME StayFocusNotes.zip SHA256SUMS.txt --title "StayFocus Notes $env:GITHUB_REF_NAME" --generate-notes
